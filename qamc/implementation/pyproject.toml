[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qamc"
version = "0.1.0"
requires-python = ">=3.12"
description = "Training-free query-adaptive memory and evidence controller"
dependencies = ["numpy", "sentence-transformers>=5,<6", "rank-bm25==0.2.2", "nltk>=3.9,<4", "tiktoken>=0.9,<1"]

[project.optional-dependencies]
pilot-data = ["pyarrow==26.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
